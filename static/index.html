<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Studie</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #1a1a2e; overflow: hidden; }
    #avatar { width: 100%; height: 100%; }

    #voice-ui {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
      font-family: system-ui, sans-serif;
    }

    .voice-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .voice-btn:hover { transform: scale(1.06); }
    .voice-btn:active { transform: scale(0.96); }
    .voice-btn svg { width: 28px; height: 28px; }

    #mic-btn {
      background: linear-gradient(145deg, #4f8bff, #2f5fd6);
    }
    #mic-btn.recording {
      background: linear-gradient(145deg, #ff5f5f, #d62f2f);
      animation: mic-pulse 1.4s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 4px 16px rgba(214, 47, 47, 0.5); }
      50% { box-shadow: 0 4px 28px rgba(214, 47, 47, 0.9); }
    }

    #recording-actions {
      display: none;
      gap: 16px;
    }
    #recording-actions.visible { display: flex; }

    #cancel-btn {
      width: 52px;
      height: 52px;
      background: #6b7280;
    }
    #send-btn {
      width: 52px;
      height: 52px;
      background: #22c55e;
    }

    #voice-status {
      min-height: 1.2em;
      color: #e6e6f0;
      font-size: 13px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    #response-panel {
      position: fixed;
      left: 24px;
      top: 45%;
      transform: translateY(-50%);
      display: flex;
      align-items: flex-start;
      z-index: 10;
      font-family: system-ui, sans-serif;
    }

    #response-toggle {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(30, 30, 50, 0.85);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease;
    }
    #response-toggle svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s ease;
    }
    #response-panel.expanded #response-toggle svg {
      transform: rotate(180deg);
    }

    #response-content {
      max-width: 0;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      margin-left: 0;
      padding: 0;
      background: rgba(20, 20, 35, 0.9);
      color: #e6e6f0;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: max-width 0.25s ease, opacity 0.2s ease, padding 0.25s ease, margin-left 0.25s ease;
    }
    #response-panel.expanded #response-content {
      max-width: 300px;
      max-height: 260px;
      opacity: 1;
      margin-left: 12px;
      padding: 14px 16px;
      overflow-y: auto;
    }
    #response-text {
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
  </style>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "talkinghead": "./TalkingHead/modules/talkinghead.mjs"
  }}
  </script>
</head>
<body>
  <div id="avatar"></div>

  <div id="response-panel">
    <button id="response-toggle" type="button" title="Antwort anzeigen" aria-label="Antwort anzeigen" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
    <div id="response-content">
      <p id="response-text"></p>
    </div>
  </div>

  <div id="voice-ui">
    <button id="mic-btn" class="voice-btn" type="button" title="Sprachaufnahme starten" aria-label="Sprachaufnahme starten">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>

    <div id="recording-actions">
      <button id="cancel-btn" class="voice-btn" type="button" title="Abbrechen" aria-label="Aufnahme abbrechen">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <button id="send-btn" class="voice-btn" type="button" title="Senden" aria-label="Aufnahme senden">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

    <p id="voice-status"></p>
  </div>

  <script>
    window.addEventListener('error', e => console.error('GLOBAL ERROR:', e.message, e.filename, e.lineno));
    window.addEventListener('unhandledrejection', e => console.error('UNHANDLED REJECTION:', e.reason && e.reason.stack || e.reason));
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
