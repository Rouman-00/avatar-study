<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Agent - Control</title>
        <link rel="stylesheet" href="control.css">
    </head>
    <body>
        <h1>Agent - Control</h1>
        <div id="status-indicator" class="status-indicator">
            <span id="status-text">Connect...</span>
        </div>

        <!-- Einstellungen -->
        <div class="section">
            <h2>Settings</h2>
            <div class="toggle-row">
            <label><input type="checkbox" id="toggle-lipsync" checked /> LipSync</label>
            <label><input type="checkbox" id="toggle-emotion" checked /> Emotion</label>
            <label><input type="checkbox" id="toggle-llm" /> LLM-Modus (freier Chatbot zum Ausprobieren)</label>
            <label class="gpu-toggle">
                <input type="checkbox" id="gpuCheckbox" />
                GPU (CUDA) für Spracherkennung verwenden
            </label>
            <label>Voice:
                <select id="voice-select">
                    <option value="en-US-Neural2-A">en-US-Neural2-A</option>
                    <option value="en-US-Wavenet-A">en-US-Wavenet-A</option>
                    <option value="en-US-Standard-A">en-US-Standard-A</option>
                    <option value="en-US-Standard-B">en-US-Wavenet-B</option>
                    <option value="en-US-Neural2-D">en-US-Neural2-D</option>
                </select>
            </label>
            <label>Whisper-Modell:
                <select id="model-select">
                    <option value="medium" selected>medium (Standard)</option>
                    <option value="small">small (schneller)</option>
                </select>
            </label>
            <label>Beam Size: <span id="beam-size-value">5</span>
                <input type="range" id="beam-size-range" min="1" max="5" value="5" />
            </label>
            <label><input type="checkbox" id="vad-filter-checkbox" /> VAD-Filter (Stille überspringen)</label>
            </div>
        </div>

        <!-- Interview -->
        <div class="section">
            <h2>Interview</h2>
            <button id="interview-start-button" type="button">Interview starten</button>
            <p id="interview-status" class="status">nicht gestartet</p>
        </div>

        <!-- Eingabe -->
        <div class="section">
            <h2>Nachricht senden</h2>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Message Input..." />
                <button id="send-button">Send</button>
                <button id="recordBtn" type="button">Aufnahme starten</button>
                <label class="file-upload">
                    Audiodatei hochladen (.wav)
                    <input type="file" id="audioFileInput" accept=".wav,audio/wav" />
                </label>
            </div>
            <p id="audio-status" class="status"></p>
        </div>

        <!-- Log -->
        <div class="section">
            <h2>Dialog</h2>
            <div id="log"></div>
        </div>

        <script src="control.js"></script>
    </body>
</html>
